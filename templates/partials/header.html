    </svg>
</header>

<!--JAVASCRIPT FOR HEADER DRIP: bell-shaped drips of varied depth along the header edge-->
<script>
(function(){
    var base = 18, depths = [30,50,36,58,32,46,28,54,38,48,30,56], n = depths.length, step = 1200 / n, w = step * .36, d = "M0," + base, gl = "";
    // point at t along the drip's left edge, shrunk toward the drip's top-center so it sits inside the yellow
    function dripPoint(c, y, t) {
        var u = 1 - t, a = u * u * u, b = 3 * u * u * t, e = 3 * u * t * t, f = t * t * t;
        var x = a * (c - w) + b * (c - w + 14) + e * (c - 12) + f * c;
        var yy = (a + b) * base + (e + f) * y;
        return (c + (x - c) * .55) + "," + ((base - 3) + (yy - base) * .7);
    }
    for (var i = 0; i < n; i++) {
        var c = i * step + step / 2, y = depths[i];
        d += " L" + (c - w) + "," + base + " C" + (c - w + 14) + "," + base + " " + (c - 12) + "," + y + " " + c + "," + y + " C" + (c + 12) + "," + y + " " + (c + w - 14) + "," + base + " " + (c + w) + "," + base;
        // curved highlight: a smaller copy of the drip's left curve
        gl += " M" + dripPoint(c, y, .05);
        for (var t = .15; t <= .85; t += .1) gl += " L" + dripPoint(c, y, t);
    }
    d += " L1200," + base;
    document.getElementById("sh_drip_line").setAttribute("d", d);
    document.getElementById("sh_drip_fill").setAttribute("d", d + " L1200,0 L0,0 Z");
    document.getElementById("sh_drip_clip_path").setAttribute("d", d + " L1200,0 L0,0 Z");
    document.getElementById("sh_drip_gloss").setAttribute("d", gl);
})();
</script>
